name: Security checks

on:
  push:
  pull_request:
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock=false --ignore-scripts
      - run: npm audit --audit-level=high --package-lock=false
        continue-on-error: true
      - run: git diff --check
